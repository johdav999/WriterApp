name: Windows desktop package

on:
  push:
    branches: [main]
    paths:
      - "WriterApp.Desktop/**"
      - "WriterApp.Device.Shared/**"
      - "WriterApp.UI.Shared/**"
      - "WriterApp.Client/src/**"
      - "WriterApp.Client/tests/**"
      - "WriterApp.Client/vite*.ts"
      - "WriterApp.Client/package*.json"
      - "WriterApp.Shared/**"
      - "WriterApp.Publishing/**"
      - "Application/Exporting/**"
      - "Application/Importing/**"
      - "Application/State/**"
      - "Domain/Documents/**"
      - "Data/Exporting/ExportTemplate.cs"
      - "scripts/windows/**"
      - ".github/workflows/desktop-windows.yml"
      - "global.json"
      - "Directory.Build.props"
  pull_request:
    branches: [main]
    paths:
      - "WriterApp.Desktop/**"
      - "WriterApp.Device.Shared/**"
      - "WriterApp.UI.Shared/**"
      - "WriterApp.Client/src/**"
      - "WriterApp.Client/tests/**"
      - "WriterApp.Client/vite*.ts"
      - "WriterApp.Client/package*.json"
      - "WriterApp.Shared/**"
      - "WriterApp.Publishing/**"
      - "Application/Exporting/**"
      - "Application/Importing/**"
      - "Application/State/**"
      - "Domain/Documents/**"
      - "Data/Exporting/ExportTemplate.cs"
      - "scripts/windows/**"
      - ".github/workflows/desktop-windows.yml"
      - "global.json"
      - "Directory.Build.props"

permissions:
  contents: read

jobs:
  desktop-package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Windows MAUI workload
        run: dotnet workload install maui-windows

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: WriterApp.Client/package-lock.json

      - name: Build bundled editor assets
        working-directory: WriterApp.Client
        run: |
          npm ci
          npm run build

      - name: Restore desktop host
        run: dotnet restore WriterApp.Desktop/WriterApp.Desktop.csproj -p:Configuration=Release

      - name: Build desktop host
        run: dotnet build WriterApp.Desktop/WriterApp.Desktop.csproj --configuration Release --framework net10.0-windows10.0.19041.0 --no-restore -warnaserror

      - name: Create test-signed MSIX
        shell: pwsh
        run: ./scripts/windows/Build-ProsaTestMsix.ps1

      - name: Publish review package and public test certificate
        uses: actions/upload-artifact@v4
        with:
          name: Prosa-Windows-test-signed
          path: |
            artifacts/windows-msix/**/*.msix
            artifacts/windows-msix/**/*.appx
            artifacts/windows-msix/signing/*.cer
          if-no-files-found: error
          retention-days: 7
