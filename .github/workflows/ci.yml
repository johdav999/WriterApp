name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            WriterApp.Client/package-lock.json
            WriterApp.Collaboration/package-lock.json

      - name: Build editor assets
        working-directory: WriterApp.Client
        run: |
          npm ci
          npm run build

      - name: Validate collaboration service and shared schema
        run: |
          npm ci --prefix WriterApp.Collaboration --ignore-scripts --no-audit --no-fund
          npm run check:collaboration --prefix WriterApp.Client
          npm run build:schema --prefix WriterApp.Collaboration
          npm test --prefix WriterApp.Collaboration

      - name: Restore .NET dependencies
        run: dotnet restore BlazorApp.sln

      - name: Build solution
        run: dotnet build BlazorApp.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Tests/WriterApp.Tests/WriterApp.Tests.csproj --configuration Release --no-build

      - name: Check authentication navigation guardrail
        run: bash scripts/check-no-forced-auth-nav.sh
