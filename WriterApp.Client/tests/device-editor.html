<link rel="stylesheet" href="../../WriterApp.UI.Shared/wwwroot/design-tokens.css">

<!-- The shared ui.css entry point applies this box model in both hosts. -->
<style>* { box-sizing: border-box; }</style></head>
<body><h1>Device editor verification</h1><ol id="results"></ol><div class="prosa-editor"><div id="editor" class="device-tiptap"></div></div>
<script type="module">
import { create, previewConsistencyRevision, previewQualityRevision, previewTargetedQualityRevision, validateQualityRange, consistencyPlainText, previewSafeConsistencyRevision, captureTranslation, previewTranslation, previewContinuation, qualityPlainText } from '../../WriterApp.Device.Shared/wwwroot/editor/device-editor.js';
import '../wwwroot/js/tiptap-editor.bundle.js';
import '../wwwroot/js/tiptap-editor-patch.js';
const results = document.querySelector('#results');
const host = document.querySelector('#editor');
const calls = [];
const receiver = { invokeMethodAsync(name, ...args) { calls.push({name, args}); return Promise.resolve(); } };
const assert = (value, message) => { if (!value) throw Error(message); };
const click = label => [...host.querySelectorAll('button')].find(button => button.textContent === label).click();
const selectText = () => { const node = host.querySelector('.tiptap p'); const range = document.createRange(); range.selectNodeContents(node); const selection = window.getSelection(); selection.removeAllRanges(); selection.addRange(range); host.querySelector('.tiptap').focus(); };
const settle = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
let editor;
async function test(name, action) {
 const row = document.createElement('li'); results.append(row);
 try { await action(); row.textContent = 'PASS: ' + name; }
 catch (error) { row.textContent = 'FAIL: ' + name + ' — ' + error.message; }
}
await test('offline initialization and external update without feedback', async () => {
 editor = create(host, '<p>Original text</p>', 'Html', receiver);
 await settle(); assert(calls.length === 0, 'Initialization emitted changes');
 editor.setContent('<p>Writing sample</p>');
 assert(calls.length === 0, 'External update emitted changes');
 assert(editor.snapshot().html.includes('Writing sample'), 'External update missing');
});
await test('shared formatting commands and HTML callback', async () => {
 selectText(); await settle(); click('Bold'); assert(editor.snapshot().html.includes('<strong>'), 'Bold missing');
 click('Italic'); assert(editor.snapshot().html.includes('<em>'), 'Italic missing');
 click('Heading 2'); assert(editor.snapshot().html.includes('<h2>'), 'Heading missing');
 click('Paragraph'); assert(editor.snapshot().html.includes('<p>'), 'Paragraph missing');
 click('Quote'); assert(editor.snapshot().html.includes('<blockquote>'), 'Quote missing'); click('Quote');
 click('Bullets'); assert(editor.snapshot().html.includes('<ul>'), 'Bullet list missing'); click('Bullets');
 click('Numbered list'); assert(editor.snapshot().html.includes('<ol>'), 'Numbered list missing'); click('Numbered list');
 assert(calls.some(call => call.name === 'OnContentChanged' && call.args[1] > 0), 'No versioned HTML callback');
});
await test('link apply, unsafe URL rejection, and removal', async () => {
 editor.setContent('<p>Link text</p>'); selectText(); await settle(); click('Link');
 const input = host.querySelector('input'); input.value = 'javascript:alert(1)'; click('Apply link');
 assert(!editor.snapshot().html.includes('javascript:'), 'Unsafe link accepted');
 input.value = 'https://example.com'; click('Apply link'); assert(editor.snapshot().html.includes('https://example.com'), 'Link missing');
 click('Link'); click('Remove link'); assert(!editor.snapshot().html.includes('<a '), 'Link remains');
});
await test('undo, redo, and Ctrl+S', async () => {
 editor.setContent('<p>History</p>'); selectText(); await settle(); click('Bold');
 const bold = editor.snapshot().html; click('Undo'); assert(editor.snapshot().html !== bold, 'Undo did nothing');
 click('Redo'); assert(editor.snapshot().html === bold, 'Redo mismatch');
 host.querySelector('.tiptap').dispatchEvent(new KeyboardEvent('keydown', { key:'s', code:'KeyS', ctrlKey:true, bubbles:true, cancelable:true }));
 assert(calls.some(call => call.name === 'OnSaveRequested'), 'Save shortcut missing');
});
await test('HTML reopen and cleanup', async () => {
 const saved = editor.snapshot().html; editor.destroy(); assert(!host.querySelector('.tiptap'), 'Editor leaked');
 editor = create(host, saved, 'Html', receiver); assert(editor.snapshot().html === saved, 'Round trip changed HTML'); editor.destroy();
});
await test('Windows formatting shortcuts, selection preservation, and save lock', async () => {
 editor = create(host, '<p>Keyboard writing</p>', 'Html', receiver);
 selectText(); await settle();
 const key = (value, code) => host.querySelector('.tiptap').dispatchEvent(new KeyboardEvent('keydown', { key:value, code, ctrlKey:true, bubbles:true, cancelable:true }));
 key('b', 'KeyB'); assert(editor.snapshot().html.includes('<strong>'), 'Ctrl+B missing');
 key('i', 'KeyI'); assert(editor.snapshot().html.includes('<em>'), 'Ctrl+I missing');
 const selected = window.getSelection().toString();
 editor.setContent(editor.snapshot().html); assert(window.getSelection().toString() === selected, 'Equal content reset selection');
 editor.setEditable(false); assert(host.querySelector('.tiptap').getAttribute('contenteditable') === 'false', 'Save lock failed');
 editor.setEditable(true); assert(host.querySelector('.tiptap').getAttribute('contenteditable') === 'true', 'Save unlock failed');
 editor.destroy();
});
await test('unsupported clipboard HTML is inserted as plain text', async () => {
 editor = create(host, '<p></p>', 'Html', receiver);
 const transfer = new DataTransfer(); transfer.setData('text/html', '<p style="color:red">Safe text</p>'); transfer.setData('text/plain', 'Safe text');
 host.querySelector('.tiptap').dispatchEvent(new ClipboardEvent('paste', { clipboardData:transfer, bubbles:true, cancelable:true }));
 assert(editor.snapshot().html.includes('Safe text') && !editor.snapshot().html.includes('<table'), 'Plain text fallback failed');
 editor.destroy();
});
await test('legacy text and JSON conversion', async () => {
 editor = create(host, '<script>text only<\/script>\nSecond line', 'LegacyText', receiver);
 assert(editor.snapshot().html.includes('&lt;script&gt;'), 'Text interpreted as HTML'); editor.destroy();
 editor = create(host, JSON.stringify({type:'doc',content:[{type:'paragraph',content:[{type:'text',text:'Legacy'}]}]}), 'LegacyJson', receiver);
 assert(editor.snapshot().html === '<p>Legacy</p>', 'JSON conversion failed'); editor.destroy();
});
await test('AI selection mapping, explicit apply, and editor undo', async () => {
 editor = create(host, '<p>Alpha beta</p>', 'Html', receiver);
 const node = host.querySelector('.tiptap p').firstChild;
 const range = document.createRange(); range.setStart(node, 6); range.setEnd(node, 10);
 const selection = window.getSelection(); selection.removeAllRanges(); selection.addRange(range);
 host.querySelector('.tiptap').focus(); await settle();
 const source = editor.captureAi();
 assert(source.plainText === 'Alpha beta' && source.selectedText === 'beta', 'Selection text mismatch');
 assert(source.selectionStart === 6 && source.selectionEnd === 10, 'Plain-text offsets mismatch');
 assert(editor.snapshot().html === source.html, 'Preview changed content');
 const applied = editor.applyAi(source.html, source.from, source.to, source.selectedText, 'new text', 'replace');
 assert(applied.html.includes('new text') && !applied.html.includes('beta'), 'Explicit apply failed');
 click('Undo'); assert(editor.snapshot().html === source.html, 'TipTap undo lost the original');
 click('Redo'); assert(editor.snapshot().html.includes('new text'), 'Redo failed');
 editor.destroy();
});
await test('style revision uses the current selection instead of an earlier collapsed selection', async () => {
 editor = create(host, '<p>Alpha beta</p>', 'Html', receiver);
 const node = host.querySelector('.tiptap p').firstChild;
 const range = document.createRange(); range.setStart(node, 6); range.setEnd(node, 10);
 const selection = window.getSelection(); selection.removeAllRanges(); selection.addRange(range);
 host.querySelector('.tiptap').focus(); await settle();
 assert(editor.captureAi(false, true).selectedText === 'beta', 'Current style selection was lost');
 selection.collapseToEnd(); await settle();
 assert(editor.captureAi(false, true).selectedText === '', 'Style reused an earlier collapsed selection');
 const page = editor.captureAi(true);
 assert(page.selectedText === 'Alpha beta' && page.selectionStart === 0, 'Style page fallback omitted writing');
 editor.destroy();
});
await test('style revision captures the whole page and applies with undo and stale checks', async () => {
 editor = create(host, '<p>Alpha beta</p><p>Second paragraph</p>', 'Html', receiver);
 const source = editor.captureAi(true);
 assert(source.selectedText === source.plainText && source.plainText === 'Alpha beta\nSecond paragraph', 'Full page capture omitted writing');
 assert(source.selectionStart === 0 && source.selectionEnd === source.plainText.length && source.from === 0, 'Whole page offsets mismatch');
 assert(editor.snapshot().html === source.html, 'Preparing style revision changed writing');
 const applied = editor.applyAi(source.html, source.from, source.to, source.selectedText, 'Clearer first paragraph.\nBetter second paragraph.', 'replace');
 assert(applied.html === '<p>Clearer first paragraph.</p><p>Better second paragraph.</p>', 'Style revision was not applied to the whole page');
 let rejected = false;
 try { editor.applyAi(source.html, source.from, source.to, source.selectedText, 'Stale revision', 'replace'); } catch { rejected = true; }
 assert(rejected && editor.snapshot().html === applied.html, 'Stale style revision overwrote writing');
 click('Undo'); assert(editor.snapshot().html === source.html, 'Undo did not restore original page');
 click('Redo'); assert(editor.snapshot().html === applied.html, 'Redo did not restore style revision');
 assert(editor.restoreAi(applied.html, source.html).html === source.html, 'Saved original could not be restored');
 editor.destroy();
});
await test('AI answers remain inert text and stale proposals cannot overwrite edits', async () => {
 editor = create(host, '<p>Safe source</p>', 'Html', receiver);
 const source = editor.captureAi();
 editor.applyAi(source.html, 0, 0, '', '<img src=x onerror=alert(1)>', 'append');
 assert(editor.snapshot().html.includes('&lt;img') && !editor.snapshot().html.includes('<img'), 'Answer was treated as HTML');
 let rejected = false;
 try { editor.applyAi(source.html, source.from, source.to, source.selectedText, 'Overwritten', 'append'); }
 catch { rejected = true; }
 assert(rejected && editor.snapshot().html.includes('&lt;img'), 'Stale proposal overwrote writing');
 editor.destroy();
});
await test('AI restore checks the applied version before replacing it', async () => {
 editor = create(host, '<p>Original</p>', 'Html', receiver);
 const before = editor.snapshot().html;
 const after = editor.applyAi(before, 0, 0, '', 'Summary', 'append').html;
 assert(after.includes('Summary'), 'Summary was not appended');
 assert(editor.restoreAi(after, before).html === before, 'Original was not restored');
 let rejected = false;
 try { editor.restoreAi(after, '<p>Other</p>'); } catch { rejected = true; }
 assert(rejected && editor.snapshot().html === before, 'Stale restore modified writing');
 editor.destroy();
});
await test('unsupported and active content is refused without editing', async () => {
 for (const content of ['<table onclick="bad()"><tr><td>Keep</td></tr></table>', '<p><img src="javascript:bad()"></p>', '<script>alert(1)<\/script>', '<p style="text-align:center;color:red">Preserve</p>']) {
  let rejected = false; try { const unexpected = create(host, content, 'Html', receiver); unexpected.destroy(); } catch { rejected = true; }
  assert(rejected, 'Unsupported content accepted: ' + content);
 }
});
await test('shared Razor toolbar adapter reports state and preserves editor commands and save locks', async () => {
 calls.length = 0;
 editor = create(host, '<p>Räksmörgås 日本語</p>', 'Html', receiver, true);
 await settle();
 assert(host.querySelector('.device-editor-toolbar').hidden, 'Legacy toolbar is still visible');
 assert(calls.some(c => c.name === 'OnFormattingChanged' && c.args[0].canBold), 'No initial formatting state');
 assert(!calls.some(c => c.name === 'OnContentChanged'), 'Initialization changed writing');
 selectText(); await settle(); editor.command('bold');
 assert(editor.snapshot().html.includes('<strong>'), 'Shared toolbar command did not format selection');
 assert(calls.some(c => c.name === 'OnFormattingChanged' && c.args[0].isBold), 'Active format not reported');
 editor.command('heading', 2); assert(editor.snapshot().html.includes('<h2>'), 'Heading command missing');
 editor.command('undo'); assert(!editor.snapshot().html.includes('<h2>'), 'Undo command missing');
 const beforeLock = editor.snapshot().html;
 editor.setEditable(false); editor.command('italic');
 assert(editor.snapshot().html === beforeLock, 'Locked editor accepted formatting');
 const lastState = calls.filter(c => c.name === 'OnFormattingChanged').at(-1);
 assert(!lastState.args[0].canBold && !lastState.args[1], 'Locked state was not reflected in toolbar');
 editor.setEditable(true); editor.command('italic');
 assert(editor.snapshot().html.includes('<em>'), 'Editor did not resume after unlock');
 editor.destroy();
});
await test('compatibility: headings 1–6, nested lists, marks and attributes round-trip', async () => {
 const html = '<h1>One</h1><h2>Two</h2><h3>Three</h3><h4>Four</h4><h5>Five</h5><h6>六</h6><p>Räksmörgås 日本語 😀 <strong>Bold</strong><em>Italic</em><u>Underline</u><s>Strike</s><code>Code</code></p><ol start="7"><li><p>Seven</p><ul><li><p>Nested</p></li></ul></li></ol><pre><code class="language-csharp">a &lt; b</code></pre><p><a href="https://example.com" target="_blank" rel="noopener noreferrer nofollow" class="reference">Link</a></p>';
 calls.length = 0;
 editor = create(host, html, 'Html', receiver, true); await settle();
 assert(!calls.some(c => c.name === 'OnContentChanged'), 'No-op open emitted writing');
 const saved = editor.snapshot().html;
 for (const token of ['<h6>六</h6>', '<u>Underline</u>', '<s>Strike</s>', 'start="7"', 'language-csharp', 'class="reference"', 'Räksmörgås 日本語 😀']) assert(saved.includes(token), 'Lost ' + token);
 editor.destroy(); editor = create(host, saved, 'Html', receiver, true);
 assert(editor.snapshot().html === saved, 'Reopen changed supported HTML');
 editor.destroy(); editor = create(host, '<p>Heading controls</p>', 'Html', receiver, true);
 for (const level of [1,2,3,4,5,6]) { editor.command('heading', level); assert(editor.snapshot().html.includes(`<h${level}>`), 'Heading command failed'); }
 editor.destroy();
});
await test('compatibility: rich source and invalid legacy data are refused before mutations', async () => {
 const fixtures = [
 ['<table onclick="bad()"><tbody><tr><td><p>Cell</p></td></tr></tbody></table>', 'Html'],
 ['<p><img src="javascript:bad()"></p>', 'Html'],
 ['<p style="text-align:center;color:red">Aligned</p>', 'Html'],
 ['<p data-future="preserve">Unknown</p>', 'Html'],
 ['<p><a href="javascript:bad()">Unsafe</a></p>', 'Html'],
 ['<ol start="bad"><li><p>List</p></li></ol>', 'Html'],
 ['<pre><strong>Lost mark</strong></pre>', 'Html'],
 ['{"type":"doc","content":[{"type":"heading","attrs":{"level":7}}]}', 'LegacyJson'],
 ['{"type":"doc","content":[{"type":"text","text":"invalid nesting"}]}', 'LegacyJson'],
 ['{"type":"doc","content":[{"type":"paragraph","attrs":{"textAlign":"invalid"}}]}', 'LegacyJson']
 ];
 for (const [source, format] of fixtures) {
   calls.length = 0; let refused = false;
   try { const candidate = create(host, source, format, receiver); candidate.destroy(); } catch { refused = true; }
   assert(refused, 'Accepted unsupported source: ' + source);
   assert(!calls.some(c => c.name === 'OnContentChanged'), 'Unsupported source emitted replacement');
 }
});
await test('web → device → web common formatting and rich web content stay intact', async () => {
 const webHost = document.createElement('div'); webHost.id = 'web-compatibility'; document.body.append(webHost);
 const source = '<h4>Four</h4><h5>Five</h5><h6>六</h6><p>Räksmörgås 日本語 <strong>Bold</strong><u>Underline</u></p><ol start="7"><li><p>Seven</p></li></ol>';
 let web = window.tiptapEditor.create(webHost.id, source, receiver); await settle();
 const fromWeb = window.tiptapEditor.getContent(web);
 window.tiptapEditor.destroy(web);
 calls.length = 0; editor = create(host, fromWeb, 'Html', receiver); await settle();
 assert(!calls.some(c => c.name === 'OnContentChanged'), 'Opening web content created a device edit');
 const fromDevice = editor.snapshot().html; editor.destroy();
 web = window.tiptapEditor.create(webHost.id, fromDevice, receiver); await settle();
 const backToWeb = window.tiptapEditor.getContent(web);
 for (const token of ['<h4>Four</h4>', '<h5>Five</h5>', '<h6>六</h6>', 'Räksmörgås 日本語', '<strong>Bold</strong>', '<u>Underline</u>', 'start="7"'])
   assert(backToWeb.includes(token), 'Round trip lost ' + token);
 window.tiptapEditor.destroy(web);
 web = window.tiptapEditor.create(webHost.id, '<p style="text-align:center">Aligned</p><table><tbody><tr><td><p>Cell</p></td></tr></tbody></table><img src="/compatibility-image.png" alt="Fixture">', receiver);
 const rich = window.tiptapEditor.getContent(web);
 assert(rich.includes('<table') && rich.includes('<img') && rich.includes('text-align: center'), 'Web advanced schema regressed');
 editor = create(host, rich, 'Html', receiver);
 const deviceRich = editor.snapshot().html;
 for (const token of ['<table', '<img', 'text-align: center', 'alt="Fixture"']) assert(deviceRich.includes(token), 'Rich device round trip lost ' + token);
 editor.destroy();
 assert(window.tiptapEditor.getContent(web) === rich, 'Device check mutated web source');
 window.tiptapEditor.destroy(web); webHost.remove();
});
await test('local search navigation selects across marks without editing or saving', async () => {
 calls.length = 0;
 editor = create(host, '<p>First page</p><p>Find <strong>ca</strong>fé 日本語 and 😀 here</p>', 'Html', receiver, true);
 await settle(); calls.length = 0;
 const before = editor.snapshot();
 assert(editor.navigateToText('café 日本語'), 'Cross-mark Unicode match was not found');
 const capture = editor.captureAi();
 assert(capture.selectedText === 'café 日本語', 'Wrong match was selected');
 assert(editor.snapshot().html === before.html && editor.snapshot().version === before.version, 'Navigation changed stored content/version');
 assert(!calls.some(c => c.name === 'OnContentChanged'), 'Navigation requested a save');
 assert(!editor.navigateToText('obsolete result'), 'Missing match accepted');
 assert(editor.captureAi().selectedText === capture.selectedText, 'Failed lookup changed selection');
 editor.destroy();
});
await test('annotation markup spans marks and Unicode, opens comments, and stays out of saved HTML', async () => {
 editor = create(host, '<p>Before <strong>café</strong> 日本語 😀 after</p>', 'Html', receiver, true);
 await settle(); calls.length = 0;
 const before = editor.snapshot();
 editor.setAnnotations([{ id:'comment-id', quote:'café 日本語 😀', kind:'comment', status:'open', content:'Review this passage' }]);
 const spans = [...host.querySelectorAll('[data-annotation-id="comment-id"]')];
 assert(spans.length && spans.map(span => span.textContent).join('') === 'café 日本語 😀', 'Incorrect quoted markup across marks');
 assert(spans.every(span => span.classList.contains('wa-annotation-comment')), 'Client comment style missing');
 assert(getComputedStyle(spans[0]).backgroundColor !== 'rgba(0, 0, 0, 0)', 'Comment highlight is invisible');
 spans[0].click();
 assert(calls.some(call => call.name === 'OnAnnotationClicked' && call.args[0] === 'comment-id'), 'Highlight did not open its comment');
 assert(editor.navigateToAnnotation('comment-id'), 'Annotation navigation failed');
 assert(editor.selectedText() === 'café 日本語 😀', 'Annotation selected the wrong passage');
 assert(JSON.stringify(editor.snapshot()) === JSON.stringify(before), 'Markup altered saved writing or version');
 assert(!calls.some(call => call.name === 'OnContentChanged'), 'Markup requested a save');
 editor.setAnnotations([{ id:'comment-id', quote:'café 日本語 😀', kind:'todo', status:'resolved', content:'Done' }]);
 assert(host.querySelector('.wa-annotation-todo.wa-annotation-resolved'), 'Resolved task style did not update');
 editor.setAnnotations([]); assert(!host.querySelector('.wa-annotation'), 'Old markup remained');
 editor.destroy();
});
await test('annotation colors remain visible when the device editor is hosted without the web editor wrapper', async () => {
 const standalone = document.createElement('div'); standalone.className = 'device-tiptap'; document.body.append(standalone);
 const standaloneEditor = create(standalone, '<p>Comment passage. Task passage.</p>', 'Html', receiver, true);
 try {
   standaloneEditor.setAnnotations([
     {id:'comment',quote:'Comment passage.',kind:'comment',status:'open',content:'Comment title'},
     {id:'task',quote:'Task passage.',kind:'todo',status:'open',content:'Task title'}
   ]);
   const comment = getComputedStyle(standalone.querySelector('.wa-annotation-comment')).backgroundColor;
   const task = getComputedStyle(standalone.querySelector('.wa-annotation-todo')).backgroundColor;
   assert(comment !== 'rgba(0, 0, 0, 0)' && task !== 'rgba(0, 0, 0, 0)', 'Device editor depends on a web wrapper for annotation colors');
   assert(comment !== task, 'Comments and tasks use the same color');
 } finally { standaloneEditor.destroy(); standalone.remove(); }
});
await test('annotation selection remains available while typing in an external comment box', async () => {
 editor = create(host, '<p>Before <strong>selected passage</strong> after</p>', 'Html', receiver, true);
 const before = editor.snapshot();
 assert(editor.navigateToText('selected passage'), 'Could not select writing');
 await settle();
 const comment = document.createElement('textarea'); document.body.append(comment);
 try {
   comment.focus(); comment.value = 'Review this passage'; await settle();
   assert(editor.selectedText() === 'selected passage', 'Panel focus lost the selected quote');
   editor.setAnnotations([{ id:'new-comment', quote:editor.selectedText(), kind:'comment', status:'open', content:comment.value }]);
   assert(host.querySelector('.wa-annotation')?.textContent === 'selected passage', 'New comment did not mark the selection');
   assert(editor.navigateToAnnotation('new-comment'), 'Comment link did not navigate');
   await settle();
   assert(document.activeElement === host.querySelector('.tiptap'), 'Navigation did not focus the editor');
   assert(window.getSelection().toString() === 'selected passage', 'Navigation did not select the annotated passage');
   assert(JSON.stringify(editor.snapshot()) === JSON.stringify(before), 'Annotation flow changed writing');
 } finally { comment.remove(); editor.destroy(); }
});
await test('a long annotation link reveals the start of its passage inside the writing viewport', async () => {
 const viewport = document.createElement('div'); viewport.className = 'editor-viewport';
 viewport.style.cssText = 'height:220px;max-height:220px;overflow:auto';
 host.before(viewport); viewport.append(host);
 const passage = 'The train eased into Vinterhamn just after sunset. '.repeat(35);
 editor = create(host, '<p>Before the passage.</p><p>' + passage + '</p><p>After the passage.</p>', 'Html', receiver, true);
 await settle();
 const before = editor.snapshot();
 editor.setAnnotations([{id:'long-quote', quote:passage, kind:'comment', status:'open', content:'Arrival'}]);
 const title = document.createElement('button'); title.textContent = 'Arrival'; document.body.append(title);
 title.addEventListener('click', () => editor.navigateToAnnotation('long-quote'));
 try {
   viewport.scrollTop = viewport.scrollHeight; title.focus(); title.click(); await settle();
   const span = host.querySelector('[data-annotation-id="long-quote"]');
   assert(span, 'The full paragraph was not highlighted');
   const start = document.createRange(); start.setStart(span.firstChild,0); start.setEnd(span.firstChild,1);
   const bounds = viewport.getBoundingClientRect(), position = start.getBoundingClientRect();
   assert(position.top >= bounds.top && position.bottom <= bounds.bottom, `Jump left the start of the annotation outside the writing viewport (start ${position.top}, bottom ${position.bottom}, viewport ${bounds.top} to ${bounds.bottom}, scroll ${viewport.scrollTop})`);
   assert(document.activeElement === host.querySelector('.tiptap'), 'Title click did not focus the writing');
   assert(editor.selectedText() === passage, 'Title click selected the wrong passage');
   assert(JSON.stringify(editor.snapshot()) === JSON.stringify(before), 'Jump changed saved writing');
 } finally { title.remove(); editor.destroy(); viewport.before(host); viewport.remove(); }
});
await test('annotation markup revalidates quotes after typing and undo without entering history', async () => {
 editor = create(host, '<p>Before unique quote after</p>', 'Html', receiver, true);
 editor.setAnnotations([{ id:'edit-id', quote:'unique quote', kind:'comment', status:'open', content:'Check' }]);
 assert(editor.navigateToText('Before'), 'Prefix not found');
 const paste = text => {
   const transfer = new DataTransfer(); transfer.setData('text/plain', text);
   host.querySelector('.tiptap').dispatchEvent(new ClipboardEvent('paste', { clipboardData:transfer, bubbles:true, cancelable:true }));
 };
 paste('A longer prefix');
 assert(host.querySelector('.wa-annotation')?.textContent === 'unique quote', 'Typing before quote moved the highlight incorrectly');
 assert(editor.navigateToAnnotation('edit-id'), 'Moved quote could not be selected');
 paste('changed passage');
 assert(!host.querySelector('.wa-annotation'), 'Changed quote stayed marked');
 assert(!editor.navigateToAnnotation('edit-id'), 'Missing quote navigation succeeded');
 editor.command('undo');
 assert(host.querySelector('.wa-annotation')?.textContent === 'unique quote', 'Undo did not restore quoted markup');
 assert(!editor.snapshot().html.includes('data-annotation'), 'Highlight leaked into HTML');
 editor.destroy();
});
await test('annotations never guess between duplicate quotes or missing text', async () => {
 editor = create(host, '<p>Repeat Repeat</p><p>Unique</p>', 'Html', receiver, true);
 editor.setAnnotations([
  { id:'duplicate', quote:'Repeat', kind:'comment', status:'open', content:'Ambiguous' },
  { id:'missing', quote:'Gone', kind:'todo', status:'open', content:'Missing' },
